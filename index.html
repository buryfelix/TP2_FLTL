<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogue de voitures électriques</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<h1>Liste des voitures électriques</h1>

<table id="tableau-voitures">

</table>

<form id="form-ajout-voiture">
    <fieldset>
    <label for="marque">Marque :</label>
    <select id="marque" name="brand">
        <option value="Tesla">Tesla</option>
        <option value="Tesla">Tesla</option>
        <option value="Tesla">Tesla</option>
    </select>

    <label for="modele">Modèle :</label>
    <select id="modele" name="model">
        <option value="Modèle S">Modèle S</option>
        <option value="Modèle X">Modèle X</option>
        <option value="Modèle 3">Modèle 3</option>
        <option value="Modèle Y">Modèle Y</option>
        <option value="Cybertruck">Cybertruck</option>
    </select>
        <label for="couleur">Couleur :</label>
        <input id="couleur" name="couleur" type="text"/>
        <label for="autonomie">Autonomie :</label>
        <input id="autonomie" name="autonomie" type="number"/>
        <label for="prix">Prix: </label>
        <input id="prix" name="prix" type="number">

        <button type="submit">Ajouter</button>
    </fieldset>
</form>
<textarea id="message-erreur" rows="4" cols="80" readonly></textarea>
<script type="text/javascript" src="lib/jQuery/jquery-4.0.0.js"></script>
<script type="module" src="js/tp2.js"></script>
</body>
</html>
